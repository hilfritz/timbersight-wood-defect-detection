<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>TimberSight Video Demonstration</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #101b15;
      color: #f3f4ed;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 32px 18px;
      background:
        radial-gradient(circle at top right, rgba(70, 105, 78, 0.3), transparent 32%),
        #101b15;
    }

    main {
      width: min(100%, 1080px);
      text-align: center;
    }

    h1 {
      margin: 0;
      color: #d6a64b;
      font-size: clamp(2rem, 6vw, 3.5rem);
      letter-spacing: 0.04em;
    }

    p {
      margin: 10px 0 24px;
      color: #aab5ab;
      font-size: 1.05rem;
    }

    video {
      display: block;
      width: 100%;
      max-height: 75vh;
      margin: 0 auto;
      border: 1px solid #385042;
      border-radius: 14px;
      background: #050806;
      box-shadow: 0 22px 60px rgba(0, 0, 0, 0.38);
    }

    a {
      display: inline-block;
      margin-top: 24px;
      color: #d6a64b;
      font-weight: 700;
      text-decoration: none;
    }

    a:hover, a:focus-visible { text-decoration: underline; }
  </style>
</head>
<body>
  <main>
    <h1>TimberSight</h1>
    <p>Real-time wood defect detection</p>

    <video controls playsinline preload="metadata" poster="demo_images/demo_thumbnail.svg">
      <source src="demo_images/demo_timbersight.mp4" type="video/mp4">
      Your browser does not support HTML5 video.
      <a href="demo_images/demo_timbersight.mp4">Download the demonstration video</a>.
    </video>

    <a href="https://github.com/hilfritz/timbersight-wood-defect-detection">&larr; Return to the GitHub repository</a>
  </main>
</body>
</html>
