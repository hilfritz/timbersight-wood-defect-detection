[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "timbersight"
version = "0.1.0"
description = "Reproducible computer-vision experiments for industrial wood-knot inspection."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "Pillow>=10.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]
ml = [
  "torch>=2.3,<3",
  "torchvision>=0.18,<1",
]

[project.scripts]
timbersight-validate = "timbersight.data.validate:main"
timbersight-profile = "timbersight.data.profile:main"
timbersight-train = "timbersight.modeling.train:main"
timbersight-evaluate = "timbersight.modeling.evaluate:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
